<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインスイーパー</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 開始画面 -->
    <div id="start-screen" class="screen">
        <h1>💣 マインスイーパー</h1>
        <div class="difficulty-selection">
            <h2>難易度を選択</h2>
            <button class="difficulty-btn" data-difficulty="easy">
                <div class="btn-title">Easy</div>
                <div class="btn-desc">9×9 / 地雷10</div>
            </button>
            <button class="difficulty-btn" data-difficulty="normal">
                <div class="btn-title">Normal</div>
                <div class="btn-desc">16×16 / 地雷40</div>
            </button>
            <button class="difficulty-btn" data-difficulty="hard">
                <div class="btn-title">Hard</div>
                <div class="btn-desc">30×16 / 地雷99</div>
            </button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">💣 残り地雷:</span>
                    <span id="mine-count" class="info-value">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">⏱️ 時間:</span>
                    <span id="timer" class="info-value">0</span>
                </div>
            </div>
            <div class="controls">
                <button id="restart-btn" class="control-btn">🔄 リスタート</button>
                <button id="back-btn" class="control-btn">⬅️ 戻る</button>
            </div>
        </div>
        <div id="board-container">
            <div id="board"></div>
        </div>
        <div class="mobile-controls">
            <button id="flag-mode-btn" class="control-btn">🚩 旗モード: OFF</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-content">
            <h1 id="result-title"></h1>
            <p id="result-message"></p>
            <div class="result-stats">
                <div>⏱️ タイム: <span id="final-time">0</span>秒</div>
            </div>
            <div class="result-buttons">
                <button id="replay-btn" class="control-btn">🔄 もう一度</button>
                <button id="menu-btn" class="control-btn">📋 メニューへ</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
